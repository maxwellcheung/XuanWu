dataset:
  class: datasets.S4126SingleChainESM2FlexChain
  path: ${DATA_DIR}
  esm_cache_dir: newcode/new_esm2_t30_150M/esm2_cache_s4126
  esm_wt_subdir: wt_pdb
  esm_mut_subdir: mut_pdb
  esm_dim: 640
  cache_dir: ${CACHE_DIR}
  preload: false
  cache_in_memory: true
  cache_write: false
  validate_pdbs: true
  split:
    test_fold: ${TEST_FOLD}
    valid_ratio: 0.1
    seed: 0
    stratify_bins: 10

task:
  class: tasks.BindingAffinityChangeWeighted
  task:
    ddG: 1
  graph_construction_model:
    class: GraphConstruction
    node_layers: []
    edge_layers:
      - class: SequentialEdge
        max_distance: 2
      - class: SpatialEdge
        radius: 10.0
        max_distance: 5
      - class: KNNEdge
        k: 10
        max_distance: 5
    edge_feature: gearnet
  criterion: huber
  metric: [mae, rmse, spearmanr, pearsonr]
  normalization: true
  weight_bins: 10
  weight_clip: 5.0
  huber_delta: 0.5
  model:
    class: models.BindModelLocal
    num_mlp_layer: 2
    use_mut_diff: true
    model:
      class: models.GearBindLocal
      input_dim: ${INPUT_DIM}
      esm_dim: 640
      esm_proj_dim: 128
      esm_proj_norm: true
      hidden_dims: [128, 128, 128, 128]
      num_relation: 7
      num_angle_bin: 8
      edge_input_dim: 59
      short_cut: true
      batch_norm: true
      activation: relu
      concat_hidden: false
      readout: sum
      use_attn: true
      local_radius: 8.0
      mutation_boost: 1.0

optimizer:
  class: optim.Adam
  lr: 5.0e-5
  weight_decay: 1.0e-5

engine:
  gpus: auto
  batch_size: 8
  num_worker: 4
  log_interval: 50

train:
  epochs: 40
